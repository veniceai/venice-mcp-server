name: Publish to npm

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY_URL: https://registry.npmjs.org
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Verify, test and pack release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SHA: ${{ github.sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      publish_tag: ${{ steps.release.outputs.publish_tag }}
      already_published: ${{ steps.npm_status.outputs.exists }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify immutable release commit before running repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release event SHA" >&2; exit 1; }
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$head_commit" == "$RELEASE_SHA" && "$tag_commit" == "$RELEASE_SHA" ]] || {
            echo "Release HEAD and peeled tag must match the immutable release event SHA" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release commit and versions
        id: release
        run: node scripts/release-integrity.mjs guard

      - name: Check npm package version
        id: npm_status
        run: node scripts/release-integrity.mjs registry

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test --ignore-scripts

      - name: Pack tested release without lifecycle scripts
        id: pack
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/npm-release
        run: node scripts/release-integrity.mjs pack

      - name: Upload exact release archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/release.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified archive
    needs: build
    if: needs.build.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: ${{ env.REGISTRY_URL }}
          package-manager-cache: false

      - name: Verify trusted publishing npm support
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Unexpected npm version");
            const [major, minor, patch] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("Trusted publishing requires npm >=11.5.1");
            }
          ' "$npm_version"

      - name: Require immutable artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid release artifact ID" >&2; exit 1; }

      - name: Download exact release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify and publish exact archive
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          PUBLISH_TAG: ${{ needs.build.outputs.publish_tag }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/npm-release
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid release digest" >&2; exit 1; }
          [[ "$PUBLISH_TAG" =~ ^[A-Za-z][0-9A-Za-z-]*$ ]] || { echo "Invalid publish tag" >&2; exit 1; }
          archive="$RELEASE_DIRECTORY/release.tgz"
          [[ -f "$archive" && ! -L "$archive" ]] || { echo "Missing release archive" >&2; exit 1; }
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict -
          npm publish "$archive" --access public --tag "$PUBLISH_TAG" --ignore-scripts --provenance --registry "$REGISTRY_URL"
